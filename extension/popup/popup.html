<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nightcell</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../icons/icon48.png" alt="" width="24" height="24">
    <span class="brand">Nightcell</span>
    <span class="ver" id="ver"></span>
  </header>

  <section class="hero">
    <div class="hero-text">
      <div class="hero-title">
        <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M235.54,150.21a104.84,104.84,0,0,1-37,52.91A104,104,0,0,1,32,120,103.09,103.09,0,0,1,52.88,57.48a104.84,104.84,0,0,1,52.91-37,8,8,0,0,1,10,10,88.08,88.08,0,0,0,109.8,109.8,8,8,0,0,1,10,10Z"/></svg>
        Dark mode
      </div>
      <div class="hero-sub" id="heroSub">On for every Google Sheet</div>
    </div>
    <button class="switch" id="enabled" role="switch" aria-checked="true" aria-label="Dark mode for Google Sheets"><span class="knob"></span></button>
  </section>

  <section class="group" id="docGroup" hidden>
    <div class="label">
      <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M200,40H56A16,16,0,0,0,40,56V200a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,80H136V56h64ZM120,56v64H56V56ZM56,136h64v64H56Zm144,64H136V136h64v64Z"/></svg>
      This sheet
    </div>
    <div class="seg" role="radiogroup" aria-label="This sheet" id="docSeg">
      <button role="radio" data-v="auto" aria-checked="true">Follow</button>
      <button role="radio" data-v="on" aria-checked="false">Always dark</button>
      <button role="radio" data-v="off" aria-checked="false">Always light</button>
    </div>
  </section>

  <section class="group">
    <div class="label">
      <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M200.77,53.89A103.27,103.27,0,0,0,128,24h-1.07A104,104,0,0,0,24,128c0,43,26.58,79.06,69.36,94.17A32,32,0,0,0,136,192a16,16,0,0,1,16-16h46.21a31.81,31.81,0,0,0,31.2-24.88,104.43,104.43,0,0,0,2.59-24A103.28,103.28,0,0,0,200.77,53.89Zm13,93.71A15.89,15.89,0,0,1,198.21,160H152a32,32,0,0,0-32,32,16,16,0,0,1-21.31,15.07C62.49,194.3,40,164,40,128a88,88,0,0,1,87.09-88h.9a88.35,88.35,0,0,1,88,87.25A88.86,88.86,0,0,1,213.81,147.6ZM140,76a12,12,0,1,1-12-12A12,12,0,0,1,140,76ZM96,100A12,12,0,1,1,84,88,12,12,0,0,1,96,100Zm0,56a12,12,0,1,1-12-12A12,12,0,0,1,96,156Zm88-56a12,12,0,1,1-12-12A12,12,0,0,1,184,100Z"/></svg>
      Theme
    </div>
    <div class="themes" role="radiogroup" aria-label="Theme" id="themes">
      <button role="radio" data-v="graphite" aria-checked="true"><span class="sw" style="--sw:#1e1e1e;--sw2:#2a2a2a"></span>Graphite</button>
      <button role="radio" data-v="midnight" aria-checked="false"><span class="sw" style="--sw:#1a1f29;--sw2:#262d3b"></span>Midnight</button>
      <button role="radio" data-v="oled" aria-checked="false"><span class="sw" style="--sw:#000000;--sw2:#181818"></span>OLED</button>
      <button role="radio" data-v="dim" aria-checked="false"><span class="sw" style="--sw:#2b2d31;--sw2:#383a40"></span>Dim</button>
    </div>
  </section>

  <section class="group">
    <div class="label">
      <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,200h-8V40a8,8,0,0,0-8-8H152a8,8,0,0,0-8,8V80H96a8,8,0,0,0-8,8v40H48a8,8,0,0,0-8,8v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16ZM160,48h40V200H160ZM104,96h40V200H104ZM56,144H88v56H56Z"/></svg>
      Charts
    </div>
    <div class="seg" role="radiogroup" aria-label="Chart colours" id="chartSeg">
      <button role="radio" data-v="keep" aria-checked="true">Keep my colours</button>
      <button role="radio" data-v="adapt" aria-checked="false">Adapt to dark</button>
    </div>
  </section>

  <label class="check">
    <input type="checkbox" id="followSystem">
    <span class="box" aria-hidden="true"></span>
    <span>
      <span class="check-title">Match my computer</span>
      <span class="check-sub">Dark only when your OS is in dark mode</span>
    </span>
  </label>

  <footer class="foot">
    <span class="kbd-row">
      <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48Zm0,144H32V64H224V192Zm-16-64a8,8,0,0,1-8,8H56a8,8,0,0,1,0-16H200A8,8,0,0,1,208,128Zm0-32a8,8,0,0,1-8,8H56a8,8,0,0,1,0-16H200A8,8,0,0,1,208,96ZM72,160a8,8,0,0,1-8,8H56a8,8,0,0,1,0-16h8A8,8,0,0,1,72,160Zm96,0a8,8,0,0,1-8,8H96a8,8,0,0,1,0-16h64A8,8,0,0,1,168,160Zm40,0a8,8,0,0,1-8,8h-8a8,8,0,0,1,0-16h8A8,8,0,0,1,208,160Z"/></svg>
      <kbd id="shortcut">Alt+Shift+D</kbd>
      <button class="link" id="editShortcut">Change</button>
    </span>
    <span class="privacy">
      <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,40H48A16,16,0,0,0,32,56v56c0,52.72,25.52,84.67,46.93,102.19,23.06,18.86,46,25.26,47,25.53a8,8,0,0,0,4.2,0c1-.27,23.91-6.67,47-25.53C198.48,196.67,224,164.72,224,112V56A16,16,0,0,0,208,40Zm0,72c0,37.07-13.66,67.16-40.6,89.42A129.3,129.3,0,0,1,128,223.62a128.25,128.25,0,0,1-38.92-21.81C61.82,179.51,48,149.3,48,112l0-56,160,0ZM82.34,141.66a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32l-56,56a8,8,0,0,1-11.32,0Z"/></svg>
      Runs locally. Reads no cell data.
    </span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
